[package]
name = "ghostwriter"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "documentation drafting over stdio MCP, backed by the local hemmingway-1 writing model"
repository = "https://github.com/jgavinray/ghostwriter"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
toml = "0.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ghostwriter"
path = "src/main.rs"
